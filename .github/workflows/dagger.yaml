name: dagger
on:
  push:
    branches: [main]

jobs:
  hello:
    name: hello
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Call Dagger Function
        uses: dagger/dagger-for-github@v8.3.0
        with:
          version: "latest"
          check: "**"
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
